# durchblick-tapnext CI: the reference check, ruff, and the tests that need no GPU (tests/test_tracks.py; the tests
# that need a CUDA device and the checkpoints skip without them).
name: ci

on:
  push:
  pull_request:

jobs:
  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_references.sh

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
      # The core (blick, github.com/xblick/durchblick) is private while it is not published.
      # DURCHBLICK_READ_TOKEN: a token with read access to it.
      - name: Access to the core
        env:
          TOKEN: ${{ secrets.DURCHBLICK_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/xblick/".insteadOf "https://github.com/xblick/"
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      - name: Tests
        timeout-minutes: 20
        run: uv run --locked pytest -q tests
