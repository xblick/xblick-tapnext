[project]
name = "durchblick-tapnext"
version = "0.1.0"
description = "TAPNext++ (DeepMind's online point tracker) as a Durchblick node: points of SAM 3's objects followed in 2D and 3D"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "David Schneider" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # blick 0.4.0 is the core renamed from durchblick. The node needs what durchblick 0.3.64 has: compressed point
    # clouds (0.3.64), RVL depth (0.3.62), ring keys with the host (0.3.59), the options as parameters and the services
    # in a daemon thread (0.3.56), a frame's partners read with it, the nearest partner by default (0.3.44)
    "blick>=0.4,<0.5",
    "torch>=2.10",
    "torchvision",  # TAPNext's ViT blocks (torchvision.models.vision_transformer.EncoderBlock)
    "einops>=0.8",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",  # undistortPoints, for the lifting
]

[project.scripts]
durchblick-tapnext = "durchblick_tapnext.node:main"
durchblick-tapnext-queries = "durchblick_tapnext.queries:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
"blick" = { git = "https://github.com/xblick/durchblick", branch = "main" }
"torch" = { index = "pytorch-cu130" }
"torchvision" = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
